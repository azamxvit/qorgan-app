name: checks

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a Flutter release cannot turn the build red on its own. Raise it
  # deliberately, together with a local `flutter upgrade`.
  FLUTTER_VERSION: 3.47.5

jobs:
  # The gate: fast, no Android SDK, nothing to flake on. The detector metrics
  # are printed by test/domain/detector_metrics_test.dart, so the run log shows
  # precision and recall for every commit.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Scoped to our own code: packages/another_telephony is a vendored fork
      # and is kept as upstream wrote it.
      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Release inspection tests
        run: python3 -m unittest discover -s scripts/tests

  # Proves the app still builds for a phone. Kept separate so an Android SDK or
  # NDK problem cannot hide a failing test.
  android:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Explicitly opt into disposable signing for this APK smoke job only.
      # Gradle rejects bundle tasks with this option. Never upload this APK to Play.
      - name: Build smoke APK (not for Google Play)
        run: flutter build apk --release
        env:
          ORG_GRADLE_PROJECT_qorganSmokeSigning: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: qorgan-smoke-apk-not-for-play
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
